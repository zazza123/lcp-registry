# Per-package tolerance overrides for regen_compare.py.
# Changing this file requires PR review — it weakens verification.
#
#   <slug>:
#     symbol_tolerance: 0.05      # fraction of the id-set union (default 0.02)
#     skip_signature_ids:         # ids whose signature is env-dependent
#       - "pkg.mod:func"

google-adk:
  # log_file_timestamp's default is datetime.now() evaluated at import
  # time — it differs on every scan by construction.
  skip_signature_ids:
    - "google.adk.cli.utils.logs:log_to_tmp_folder"

beautifulsoup4:
  # AnnouncingParser inherits html.parser.HTMLParser.__init__, whose
  # signature varies across CPython patch releases (the 'scripting'
  # kwarg appeared in a 3.12.x patch).
  skip_signature_ids:
    - "bs4.diagnose:AnnouncingParser"

tqdm:
  # Optional UI submodules (tqdm.tk, 44 ids) import only when the
  # interpreter ships tkinter, which differs between Python builds:
  # the published manifest (tk-less build) lacks them while CI's
  # interpreter has them. Denominator shrank after the test-subpackage
  # exclusion (lcp 638a2882), so the same 44-id delta is now ~14% of
  # the union. A future regen from a tk-enabled build would include
  # tqdm.tk and allow tightening this back.
  symbol_tolerance: 0.15
