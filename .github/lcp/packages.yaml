# Single source of truth for tracked packages (weekly updater + batch
# population share this list). Source: hugovk top-pypi-packages 30-day
# downloads (fetched 2026-07-08) plus google-adk and
# azure-ai-contentunderstanding. Exclusions: packaging/build infra, type
# stubs, CLI-only tools; polars force-included as the roadmap exit criterion.
#
# Per-package fields:
#   name                 PyPI distribution name / directory slug (required)
#   import_name          importable module, when it differs from name
#   include_prereleases  track prereleases too (default: false)
#   keep_versions        ensure the N newest versions exist on disk, additive,
#                        never prunes older manifests (default: 2)
#   env                  extra environment variables applied while installing
#                        and scanning this package (install/build knobs, e.g.
#                        CMAKE_POLICY_VERSION_MINIMUM for old sdist builds).
#                        Used by both build_manifests.py and regen_compare.py
#                        so generation and CI verification match (default: {})
#   constraints          pip constraint specifiers (e.g. "pgvector<0.5") passed
#                        as `pip -c` when installing this package, for metadata
#                        that under-pins a dependency badly enough to break the
#                        install or import. Also applied by regen_compare.py so
#                        both resolve the same closure. These change the
#                        manifest's dependency closure — justify each entry in
#                        a comment, as in verify-overrides.yaml (default: [])
#   install_with         extra distributions installed alongside this package,
#                        for metadata that omits a dependency the package
#                        imports anyway (soupsieve imports bs4 unconditionally
#                        but declares nothing, avoiding a metadata cycle with
#                        beautifulsoup4). Without them the target is not
#                        importable and the scan cannot run. Applied by both
#                        build_manifests.py and regen_compare.py. Unpinned —
#                        pin via constraints if it matters (default: [])
python:
  - name: boto3
  - name: urllib3
  - name: certifi
  - name: idna
  - name: requests
  - name: typing-extensions
  - name: charset-normalizer
  - name: botocore
  - name: cryptography
  - name: aiobotocore
  - name: pygments
  - name: pluggy
  - name: python-dateutil
    import_name: dateutil
  - name: six
  - name: pyyaml
    import_name: yaml
  - name: numpy
  - name: cffi
  - name: pydantic
  - name: pytest
  - name: click
  - name: pycparser
  - name: iniconfig
  - name: grpcio-status
  - name: pydantic-core
  - name: anyio
  - name: s3transfer
  - name: attrs
  - name: protobuf
    import_name: google.protobuf
  - name: h11
  - name: fsspec
  - name: annotated-types
  - name: pandas
  - name: s3fs
  - name: markupsafe
  - name: httpx
  - name: httpcore
  - name: platformdirs
  - name: typing-inspection
  - name: jinja2
  - name: python-dotenv
    import_name: dotenv
  - name: filelock
  - name: pathspec
  - name: pyjwt
    import_name: jwt
  - name: litellm
  - name: aiohttp
  - name: rich
  - name: jmespath
  - name: markdown-it-py
  - name: yarl
  - name: tqdm
  - name: propcache
  - name: rpds-py
  - name: multidict
  - name: google-auth
    import_name: google.auth
  - name: jsonschema
  - name: starlette
  - name: mdurl
  - name: pytz
  - name: pyasn1
  - name: aiohappyeyeballs
  - name: frozenlist
  - name: importlib-metadata
  - name: zipp
  - name: uvicorn
  - name: aiosignal
  - name: opentelemetry-sdk
    import_name: opentelemetry.sdk
  - name: sglang
  - name: fastapi
  - name: trove-classifiers
  - name: referencing
  - name: googleapis-common-protos
  - name: tzdata
  - name: jsonschema-specifications
  - name: pillow
    import_name: PIL
  - name: opentelemetry-semantic-conventions
    import_name: opentelemetry.semconv
  - name: google-api-core
    import_name: google.api_core
  - name: annotated-doc
  - name: wrapt
  - name: pyasn1-modules
  - name: greenlet
  - name: grpcio
  - name: sniffio
  - name: typer
  - name: colorama
  - name: tenacity
  - name: websockets
  - name: opentelemetry-api
    import_name: opentelemetry
  - name: scipy
  - name: shellingham
  - name: pyarrow
  - name: beautifulsoup4
    import_name: bs4
  - name: pyparsing
  - name: sqlalchemy
  - name: huggingface-hub
  - name: soupsieve
    # soupsieve/css_match.py does an unconditional `import bs4`, but soupsieve
    # declares no dependencies at all — beautifulsoup4 depends on soupsieve, so
    # declaring bs4 would close a metadata cycle. A standalone install is
    # therefore not importable and the scan fails; co-install bs4, which pulls
    # no pin of its own (it requires soupsieve>1.2, so our pin survives).
    install_with:
      - beautifulsoup4
  - name: regex
  - name: tomli
  - name: opentelemetry-exporter-otlp-proto-http
    import_name: opentelemetry.exporter.otlp.proto.http
  - name: pydantic-settings
  - name: polars
  - name: azure-ai-contentunderstanding
    import_name: azure.ai.contentunderstanding
  - name: google-adk
    import_name: google.adk
  # Phase-8 benchmark targets: tracked at exactly the version pinned by the
  # benchmark harness (all currently the PyPI latest). keep_versions: 1 so the
  # registry serves the single pinned version and latest.json points at it; the
  # weekly updater maintains only the newest version for these entries.
  - name: cyhole
    keep_versions: 1
  - name: hamana
    keep_versions: 1
  - name: pixeltable
    # keep_versions 2 covers 0.6.6 (the Phase-8 benchmark pin) and 0.6.7.
    keep_versions: 2
    # Both declare pgvector>=0.4.0 with no upper bound, but pgvector 0.5.0
    # moved HalfVector out of pgvector.sqlalchemy, so an unconstrained install
    # resolves to 0.5.0 and pixeltable fails to import. Drop this once a
    # tracked release pins pgvector itself.
    constraints:
      - "pgvector<0.5"
  - name: pocket-coffea
    keep_versions: 1
    # awkward (<2, no cp312 wheels) builds from sdist; its old
    # cmake_minimum_required is rejected by the pip build-isolation CMake >= 4
    # unless this policy floor is set.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  - name: narwhals
    keep_versions: 1
  - name: griffe
    # The 'griffe' dist is a wrapper that installs the 'griffelib' dist, which
    # provides the importable 'griffe' module; auto-detect can't bridge that.
    import_name: griffe
    keep_versions: 1
  - name: cyclopts
    keep_versions: 1
  - name: fastmcp
    # The 'fastmcp' dist installs 'fastmcp-slim', which provides the importable
    # 'fastmcp' module; auto-detect can't bridge that.
    import_name: fastmcp
    keep_versions: 1
  - name: flask
    keep_versions: 1
