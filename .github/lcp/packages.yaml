# Single source of truth for tracked packages (weekly updater + batch
# population share this list). Source: hugovk top-pypi-packages 30-day
# downloads (fetched 2026-07-08) plus google-adk and
# azure-ai-contentunderstanding. Exclusions: packaging/build infra, type
# stubs, CLI-only tools; polars force-included as the roadmap exit criterion.
#
# Per-package fields:
#   name                 PyPI distribution name / directory slug (required)
#   import_name          importable module, when it differs from name
#   include_prereleases  track prereleases too (default: false)
#   keep_versions        ensure the N newest versions exist on disk, additive,
#                        never prunes older manifests (default: 2)
python:
  - name: boto3
  - name: urllib3
  - name: certifi
  - name: idna
  - name: requests
  - name: typing-extensions
  - name: charset-normalizer
  - name: botocore
  - name: cryptography
  - name: aiobotocore
  - name: pygments
  - name: pluggy
  - name: python-dateutil
    import_name: dateutil
  - name: six
  - name: pyyaml
    import_name: yaml
  - name: numpy
  - name: cffi
  - name: pydantic
  - name: pytest
  - name: click
  - name: pycparser
  - name: iniconfig
  - name: grpcio-status
  - name: pydantic-core
  - name: anyio
  - name: s3transfer
  - name: attrs
  - name: protobuf
    import_name: google.protobuf
  - name: h11
  - name: fsspec
  - name: annotated-types
  - name: pandas
  - name: s3fs
  - name: markupsafe
  - name: httpx
  - name: httpcore
  - name: platformdirs
  - name: typing-inspection
  - name: jinja2
  - name: python-dotenv
    import_name: dotenv
  - name: filelock
  - name: pathspec
  - name: pyjwt
    import_name: jwt
  - name: litellm
  - name: aiohttp
  - name: rich
  - name: jmespath
  - name: markdown-it-py
  - name: yarl
  - name: tqdm
  - name: propcache
  - name: rpds-py
  - name: multidict
  - name: google-auth
    import_name: google.auth
  - name: jsonschema
  - name: starlette
  - name: mdurl
  - name: pytz
  - name: pyasn1
  - name: aiohappyeyeballs
  - name: frozenlist
  - name: importlib-metadata
  - name: zipp
  - name: uvicorn
  - name: aiosignal
  - name: opentelemetry-sdk
    import_name: opentelemetry.sdk
  - name: sglang
  - name: fastapi
  - name: trove-classifiers
  - name: referencing
  - name: googleapis-common-protos
  - name: tzdata
  - name: jsonschema-specifications
  - name: pillow
    import_name: PIL
  - name: opentelemetry-semantic-conventions
    import_name: opentelemetry.semconv
  - name: google-api-core
    import_name: google.api_core
  - name: annotated-doc
  - name: wrapt
  - name: pyasn1-modules
  - name: greenlet
  - name: grpcio
  - name: sniffio
  - name: typer
  - name: colorama
  - name: tenacity
  - name: websockets
  - name: opentelemetry-api
    import_name: opentelemetry
  - name: scipy
  - name: shellingham
  - name: pyarrow
  - name: beautifulsoup4
    import_name: bs4
  - name: pyparsing
  - name: sqlalchemy
  - name: huggingface-hub
  - name: soupsieve
  - name: regex
  - name: tomli
  - name: opentelemetry-exporter-otlp-proto-http
    import_name: opentelemetry.exporter.otlp.proto.http
  - name: pydantic-settings
  - name: polars
  - name: azure-ai-contentunderstanding
    import_name: azure.ai.contentunderstanding
  - name: google-adk
    import_name: google.adk
  # Phase-8 benchmark targets: tracked at exactly the version pinned by the
  # benchmark harness (all currently the PyPI latest). keep_versions: 1 so the
  # registry serves the single pinned version and latest.json points at it; the
  # weekly updater maintains only the newest version for these entries.
  - name: cyhole
    keep_versions: 1
  - name: hamana
    keep_versions: 1
  # NOTE: pocket-coffea (0.9.13) and pixeltable (0.6.6) are Phase-8 benchmark
  # targets but are NOT tracked here: their manifests cannot be regenerated in
  # CI. pocket-coffea needs awkward 1.10.5 built from sdist (no cp312 wheels),
  # which fails under the pip build-isolation CMake (>=4) without
  # CMAKE_POLICY_VERSION_MINIMUM=3.5, unsettable from a manifest PR. pixeltable
  # requires pgvector>=0.4.0 (unbounded), so pip pulls pgvector 0.5.0 and the
  # package fails to import (HalfVector). Neither is fixable via
  # verify-overrides.yaml (which only tolerates symbol/signature diffs).
  - name: narwhals
    keep_versions: 1
  - name: griffe
    # The 'griffe' dist is a wrapper that installs the 'griffelib' dist, which
    # provides the importable 'griffe' module; auto-detect can't bridge that.
    import_name: griffe
    keep_versions: 1
  - name: cyclopts
    keep_versions: 1
  - name: fastmcp
    # The 'fastmcp' dist installs 'fastmcp-slim', which provides the importable
    # 'fastmcp' module; auto-detect can't bridge that.
    import_name: fastmcp
    keep_versions: 1
  - name: flask
    keep_versions: 1
