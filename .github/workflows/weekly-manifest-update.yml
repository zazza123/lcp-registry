name: Weekly PyPI Manifest Updater

# Unified with the populate engine (build_manifests.py): the plan job polls
# PyPI for tracked packages in packages.yaml and emits the ones with missing
# versions; the build matrix regenerates each in an isolated venv and opens one
# auto-merging PR per package. verify-manifests.yml then gates each PR exactly
# like a manual submission.
#
# The PR is opened with MANIFEST_BOT_TOKEN (a PAT), NOT the default
# GITHUB_TOKEN: a PR opened by GITHUB_TOKEN does not trigger verify-manifests
# (GitHub loop-prevention), which would let auto-merge land an unverified PR.

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      names: ${{ steps.plan.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/lcp/requirements.txt'
      - name: Install pinned lcp + deps
        run: pip install -r .github/lcp/requirements.txt
      - name: Compute packages with missing versions
        id: plan
        run: |
          PLAN=$(PYTHONPATH=.github/lcp python .github/lcp/build_manifests.py --plan)
          echo "$PLAN" > plan.json
          cat plan.json
          echo "packages=$PLAN" >> "$GITHUB_OUTPUT"
          echo "names=$(echo "$PLAN" | jq -c '[.[].name]')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.names != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MANIFEST_BOT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/lcp/requirements.txt'
      - name: Install pinned lcp + deps
        run: pip install -r .github/lcp/requirements.txt
      - name: Generate manifests for this package
        env:
          PKG: ${{ matrix.name }}
        run: |
          PYTHONPATH=.github/lcp python .github/lcp/build_manifests.py --only "$PKG"
      - name: Open auto-merging PR
        env:
          GH_TOKEN: ${{ secrets.MANIFEST_BOT_TOKEN }}
          PKG: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes for $PKG — nothing to do."
            exit 0
          fi
          BRANCH="manifest-bot/${PKG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifests/
          git commit -m "ADD: python/${PKG} weekly manifest update

          Automated weekly regeneration for ${PKG} via build_manifests.py."
          git push --force-with-lease origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main --head "$BRANCH" \
            --title "ADD: python/${PKG} weekly manifest update" \
            --body "Automated weekly manifest update for \`${PKG}\`. Gated by verify-manifests.yml; auto-merges on green.")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
