name: Verify Manifests

# Automated trust: a green check on this workflow replaces manual review of
# manifest submissions.
#
# SECURITY MODEL — the `regenerate` job pip-installs the (package, version)
# claimed by the PR from PyPI, which EXECUTES ARBITRARY CODE. Containment:
#   * trigger is `pull_request` (never pull_request_target): fork PRs run
#     with a read-only GITHUB_TOKEN and NO access to repository secrets;
#   * workflow-level `permissions: contents: read`;
#   * GitHub-hosted runners are ephemeral VMs, destroyed after each job;
#   * network egress used: pypi.org + files.pythonhosted.org (package
#     download), github.com (checkout + pinned lcp install).
# Do not add secrets to this workflow. Do not weaken the trigger: it must stay
# `pull_request` (never `pull_request_target`).
#
# The trigger has NO `paths` filter on purpose: the `verify` job below is the
# single stable status check that branch protection requires, so it must report
# on EVERY pull request (a required check that never runs blocks the PR). The
# heavy `layout`/`regenerate` jobs stay gated on `detect` finding changed
# manifests, so a PR that touches no manifests skips them and `verify` passes
# cheaply — no untrusted package code runs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.diff.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List added/changed manifest files
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- 'manifests/**/*.lcp.json.gz')
          echo "$FILES"
          echo "manifests=$(echo "$FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  layout:
    needs: detect
    if: needs.detect.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lcp + deps
        run: pip install -r .github/lcp/requirements.txt
      - name: Layout / schema / latest.json checks
        env:
          MANIFESTS: ${{ needs.detect.outputs.manifests }}
        run: |
          echo "$MANIFESTS" | jq -r '.[]' | xargs \
            env PYTHONPATH=.github/lcp python .github/lcp/verify_layout.py

  regenerate:
    needs: detect
    if: needs.detect.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.detect.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lcp + deps
        run: pip install -r .github/lcp/requirements.txt
      - name: Regenerate and compare (runs untrusted package code)
        env:
          # env-var indirection: a crafted filename must not reach the shell
          # via ${{ }} substitution (command injection).
          MANIFEST: ${{ matrix.manifest }}
        run: |
          PYTHONPATH=.github/lcp python .github/lcp/regen_compare.py "$MANIFEST"

  # Single stable status check for branch protection. It always runs (no
  # `if` guard, `if: always()` so it reports even when upstream jobs fail),
  # and passes when the manifest jobs succeeded OR were skipped (a PR that
  # changed no manifests). Require ONLY this check on `main` — the matrix
  # `regenerate` checks have per-file names that change every PR and cannot be
  # required by a fixed name.
  verify:
    needs: [detect, layout, regenerate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on manifest verification
        env:
          # trusted enum values (success/failure/skipped/cancelled), but routed
          # through env for consistency with this repo's injection-safe style.
          DETECT: ${{ needs.detect.result }}
          LAYOUT: ${{ needs.layout.result }}
          REGENERATE: ${{ needs.regenerate.result }}
        run: |
          echo "detect=$DETECT layout=$LAYOUT regenerate=$REGENERATE"
          if [ "$DETECT" != 'success' ]; then
            echo "::error::detect job did not succeed"
            exit 1
          fi
          for result in "$LAYOUT" "$REGENERATE"; do
            if [ "$result" != 'success' ] && [ "$result" != 'skipped' ]; then
              echo "::error::manifest verification did not pass ($result)"
              exit 1
            fi
          done
          echo "verification gate passed"
